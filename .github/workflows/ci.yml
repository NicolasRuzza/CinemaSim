name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer run on the same branch or pull request cancels the one still in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CinemaSim.slnx

      - name: Build
        run: dotnet build CinemaSim.slnx --configuration Release --no-restore

      # Runs every test project, including the ones that start a Redis container: the runner already has Docker.
      - name: Test
        run: dotnet test CinemaSim.slnx --configuration Release --no-build --logger trx --results-directory TestResults

      - name: Upload the test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          retention-days: 7
